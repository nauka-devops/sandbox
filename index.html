<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statusownia — status usług</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Statusownia</h1>
    <p class="subtitle">Status usług firmy Przykładowo Sp. z o.o.</p>
  </header>

  <main>
    <table class="status-table">
      <thead>
        <tr>
          <th>Usługa</th>
          <th>Status</th>
          <th>Uwagi</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Strona WWW</td>
          <td><span class="status ok">operational</span></td>
          <td>—</td>
        </tr>
        <tr>
          <td>Poczta</td>
          <td><span class="status ok">operational</span></td>
          <td>—</td>
        </tr>
        <tr>
          <td>VPN</td>
          <td><span class="status warn">degraded</span></td>
          <td>wolne łącze, pracujemy nad tym</td>
        </tr>
        <tr>
          <td>n8n (automatyzacje)</td>
          <td><span class="status ok">operational</span></td>
          <td>—</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>Poligon do nauki PR — org <strong>nauka-devops</strong></p>
  </footer>
</body>
</html>
